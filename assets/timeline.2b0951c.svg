<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="career timeline, december 2023 to june 2026">
<style>
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }

.rl   { font-size: 13px; fill: #ebdbb2; }
.rc   { font-size: 11px; fill: #928374; }
.ax   { font-size: 11px; fill: #928374; }
.hd   { font-size: 13px; fill: #b8bb26; font-weight: 700; }
.bar  { transform-box: fill-box; transform-origin: left center;
        animation: grow .7s cubic-bezier(.2,.8,.2,1) backwards; }
@keyframes grow { from { transform: scaleX(.02) } to { transform: scaleX(1) } }
.lbl  { animation: fin .5s ease-out backwards; }
@keyframes fin { from { opacity: 0; transform: translateX(-6px) }
                 to { opacity: 1; transform: translateX(0) } }
</style>
<rect x="0" y="0" width="900" height="330" rx="10" fill="#282828"/>
<text class="mono hd" x="24" y="32">ledq@github:~$ git log --graph --since=2023</text>
<line x1="317.9" y1="46" x2="317.9" y2="300" stroke="#3c3836"/>
<text class="mono ax" x="317.9" y="318" text-anchor="middle">2024</text>
<line x1="532.4" y1="46" x2="532.4" y2="300" stroke="#3c3836"/>
<text class="mono ax" x="532.4" y="318" text-anchor="middle">2025</text>
<line x1="746.9" y1="46" x2="746.9" y2="300" stroke="#3c3836"/>
<text class="mono ax" x="746.9" y="318" text-anchor="middle">2026</text>
<rect class="bar" x="300.0" y="64" width="429.0" height="10" rx="5" fill="#504945" style="animation-delay:0s"/>
<g class="lbl" style="animation-delay:.1s"><text class="mono rc" x="288" y="73" text-anchor="end">b.s. computer science</text></g>
<rect class="bar" x="300.0" y="92" width="71.5" height="18" rx="9" fill="#8ec07c" style="animation-delay:0.12s"/>
<g class="lbl" style="animation-delay:0.12s"><text class="mono rl" x="288" y="101" text-anchor="end">robotics swe</text><text class="mono rc" x="288" y="116" text-anchor="end">rose-hulman ventures</text></g>
<rect class="bar" x="353.6" y="126" width="107.2" height="18" rx="9" fill="#d3869b" style="animation-delay:0.21s"/>
<g class="lbl" style="animation-delay:0.21s"><text class="mono rl" x="288" y="135" text-anchor="end">teaching assistant, os</text><text class="mono rc" x="288" y="150" text-anchor="end">rose-hulman</text></g>
<rect class="bar" x="443.0" y="160" width="160.9" height="18" rx="9" fill="#83a598" style="animation-delay:0.30s"/>
<g class="lbl" style="animation-delay:0.30s"><text class="mono rl" x="288" y="169" text-anchor="end">full-stack engineer</text><text class="mono rc" x="288" y="184" text-anchor="end">worldclass</text></g>
<rect class="bar" x="550.2" y="194" width="53.6" height="18" rx="9" fill="#8ec07c" style="animation-delay:0.39s"/>
<g class="lbl" style="animation-delay:0.39s"><text class="mono rl" x="288" y="203" text-anchor="end">ml engineer</text><text class="mono rc" x="288" y="218" text-anchor="end">rose-hulman ventures / quadralynx</text></g>
<rect class="bar" x="603.9" y="228" width="125.1" height="18" rx="9" fill="#fe8019" style="animation-delay:0.48s"/>
<g class="lbl" style="animation-delay:0.48s"><text class="mono rl" x="288" y="237" text-anchor="end">swe intern</text><text class="mono rc" x="288" y="252" text-anchor="end">upper hand ai</text></g>
<rect class="bar" x="729.0" y="262" width="107.2" height="18" rx="9" fill="#fabd2f" style="animation-delay:0.57s"/>
<g class="lbl" style="animation-delay:0.57s"><text class="mono rl" x="288" y="271" text-anchor="end">data engineer</text><text class="mono rc" x="288" y="286" text-anchor="end">upper hand ai</text></g>
</svg>
