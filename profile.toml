# Everything on the profile page that is *content*. Edit here, then run
#   python3 assets/build.py
# Rendering, layout, palette, and the icon geometry live in assets/build.py.
#
# Colors may be a palette name (bg bg1 bg2 gray fg fg_dim red green yellow
# blue purple aqua orange) or a raw hex string.

# --------------------------------------------------------------------------
# hero card
# --------------------------------------------------------------------------

# ASCII wordmark, drawn left of the info block. Leading spaces are significant.
wordmark = """
 ███               █
   █               █
   █               █
   █     ███    ██▓█   ██▓█
   █    ▓▓ ▒█  █▓ ▓█  █▓ ▓█
   █    █   █  █   █  █   █
   █    █████  █   █  █   █
   █    █      █   █  █   █
   █░   ▓▓  █  █▓ ▓█  █▓ ▓█
   ▒██   ███▒   ██▓█   ██▓█
                          █
                          █
                          █ """

# One row per line of the neofetch block. `icon` names a glyph from the
# library in build.py: briefcase target code cloud database globe network
# cap dot. `color` is optional and defaults to the key color.
[[info]]
key = "Role"
value = "Software Engineer (data · platform · AI/ML)"
icon = "briefcase"

[[info]]
key = "Focus"
value = "full-stack apps, the data platform beneath, AI/ML"
icon = "target"

[[info]]
key = "Langs"
value = "Python · TypeScript · SQL · C/C++"
icon = "code"

[[info]]
key = "Cloud"
value = "GCP · Docker · Terraform"
icon = "cloud"

[[info]]
key = "Data"
value = "BigQuery · Airflow · Dataform · Postgres"
icon = "database"

[[info]]
key = "Web"
value = "Next.js · React · FastAPI · GraphQL"
icon = "globe"

[[info]]
key = "ML"
value = "PyTorch · ONNX · LangChain · XGBoost"
icon = "network"

[[info]]
