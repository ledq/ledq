[card]
title = "ledq: ~"          # window titlebar
host = "ledq@github-ricin" # the user@host line; its underline follows its length

# Brand glyphs where a neofetch card puts its terminal color swatches.
# Two rows of eight; slugs must appear in a [[stack.groups]] block below, which is
# where their color comes from.
icons = [
  ["python", "typescript", "cplusplus", "googlecloud", "docker", "terraform",
   "postgresql", "googlebigquery"],
  ["apacheairflow", "nextdotjs", "react", "fastapi", "graphql", "pytorch",
   "langchain", "linux"],
]

# --------------------------------------------------------------------------
# stack grid
# --------------------------------------------------------------------------

# `slug` must exist in assets/icons.json. To add one that is not vendored yet:
#   curl -s https://cdn.jsdelivr.net/npm/simple-icons/icons/<slug>.svg
# and add its path data to icons.json. Colors are brand hex, brightened where
# the official one disappears against a dark background.

[stack]
# Real parts of the stack with no brand glyph to draw.
