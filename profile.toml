# --------------------------------------------------------------------------
# contact
# --------------------------------------------------------------------------

# Each link renders as its own transcript block, wrapped in an <a> by the
# README. Links inside an SVG are inert on GitHub, which is why these are
# separate files rather than one window. `cmd` is the command shown at the
# prompt; `value` is the line of output under it.

[contact]
[[contact.links]]
name = "linkedin"
cmd = "xdg-open linkedin"
icon = "linkedin"
color = "#4C9BE8"
label = "linkedin"
value = "/in/duyleq"
href = "https://linkedin.com/in/duyleq"

[[contact.links]]
name = "email"
cmd = "xdg-open email"
icon = "gmail"
color = "#EA5C4F"
label = "email"
value = "danielqle19@gmail.com"
href = "mailto:danielqle19@gmail.com"
